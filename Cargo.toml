[package]
name = "gift_coordination"
version = "0.1.0"
authors = ["ZachNo"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = "1.0.217"
serde_json = "1.0.138"
rand = "0.9.0"
hex = "0.4.3"
config-file = "0.2.3"

[dependencies.uuid]
version = "1.13.1"
features = ["serde", "v4"]

[dependencies.rusqlite]
version = "0.29.0"
features = ["bundled"]

[dependencies.rocket]
version = "0.5.1"
features = ["secrets"]

[dependencies.rocket_dyn_templates]
version = "0.2.0"
features = ["handlebars", "tera"]

[dependencies.rocket_sync_db_pools]
version = "0.1.0"
default-features = false
features = ["sqlite_pool"]

[dependencies.lettre]
version = "0.11.12"
features = ["sendmail-transport"]
